name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型检查 · 测试 · 构建
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tw_app
          POSTGRES_PASSWORD: tw_app_pwd_2026
          POSTGRES_DB: teacher_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tw_app -d teacher_workbench_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tw_app:tw_app_pwd_2026@127.0.0.1:5432/teacher_workbench_test
      TEST_DATABASE_URL: postgres://tw_app:tw_app_pwd_2026@127.0.0.1:5432/teacher_workbench_test
      JWT_SECRET: ci-only-secret-not-for-production
      CORS_ORIGIN: http://localhost:5173
      LOGIN_RATE_LIMIT_MAX: '200'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁定版本）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 未使用依赖检查
        run: pnpm lint:deps

      - name: 单元 / 集成 / 组件测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 验证后端产物可独立启动
        run: |
          cd apps/api
          node dist/server.js > /tmp/api-artifact.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "后端产物健康检查通过"
              exit 0
            fi
            sleep 1
          done
          echo "后端产物未能在 30 秒内通过健康检查"
          cat /tmp/api-artifact.log
          exit 1

  e2e:
    name: 端到端测试
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tw_app
          POSTGRES_PASSWORD: tw_app_pwd_2026
          POSTGRES_DB: teacher_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tw_app -d teacher_workbench_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tw_app:tw_app_pwd_2026@127.0.0.1:5432/teacher_workbench_test
      TEST_DATABASE_URL: postgres://tw_app:tw_app_pwd_2026@127.0.0.1:5432/teacher_workbench_test
      JWT_SECRET: ci-only-secret-not-for-production
      CORS_ORIGIN: http://localhost:5173
      LOGIN_RATE_LIMIT_MAX: '200'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁定版本）
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器
        run: pnpm --filter @tw/e2e exec playwright install --with-deps chromium

      - name: 端到端测试
        run: pnpm e2e

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
